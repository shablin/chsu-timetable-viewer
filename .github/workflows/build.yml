name: Build CRX

on:
    push:
        branches: ["main"]
        tags:
            - "v*"

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
            uses: actions/checkout@v4

            - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22

            - name: Install CRX packer
            run: npm install -g crx

            - name: Restore private key
            run: |
                echo "${{ secrets.CRX_PRIVATE_KEY }}" > extension.pem

            - name: Build CRX
            run: |
                crx pack extension \
                    -p unlinker.pem \
                    -o unlinker.crx

            - name: Upload CRX
            uses: actions/upload-artifact@v4
            with:
                name: unlinker
                path: unlinker.crx