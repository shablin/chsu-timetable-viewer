name: Build CRX

on:
    push:
        tags:
            - "v*"

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22

          - name: Install CRX packer
            run: npm install -g crx

          - name: Get extension version
            id: version
            shell: bash
            run: |
                VERSION=$(jq -r '.version' extension/manifest.json)

                if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                    echo "version not found in manifest.json"
                    exit 1
                fi

                echo "Extension version: $VERSION"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          - name: Restore private key
            run: |
                echo "${{ secrets.CRX_PRIVATE_KEY }}" > unlinker.pem

          - name: Build CRX
            run: |
                crx pack extension \
                    -p unlinker.pem \
                    -o "unlinker-${{ steps.version.outputs.version }}.crx"

          - name: Upload CRX
            uses: actions/upload-artifact@v4
            with:
                name: unlinker-${{ steps.version.outputs.version }}
                path: "unlinker-${{ steps.version.outputs.version }}.crx"
                generate_release_notes: true